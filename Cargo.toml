[package]
name = "gitscope"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.87"
description = "A Rust CLI for analyzing Git repository statistics."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/MrSaltz/GitScope"
homepage = "https://github.com/MrSaltz/GitScope"
keywords = ["git", "statistics", "cli", "repository", "analytics"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".gitattributes"]

[lib]
name = "gitscope"
path = "src/lib.rs"

[[bin]]
name = "gitscope"
path = "src/main.rs"

[features]
# Clones remotos por HTTP(S); `--no-default-features` compila sem TLS (OpenSSL no Linux).
default = ["remote"]
remote = ["git2/https"]
# Embute o OpenSSL (precisa de perl e make); usado nos binários de release do Linux.
vendored-openssl = ["remote", "git2/vendored-openssl"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
git2 = { version = "0.21", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "analysis"
harness = false
